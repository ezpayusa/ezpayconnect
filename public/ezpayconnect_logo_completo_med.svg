<svg viewBox="0 0 560 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ezpayGradientWordmark" x1="10" y1="20" x2="150" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1857D6"/>
      <stop offset="100%" stop-color="#12B7A0"/>
    </linearGradient>
  </defs>

  <!-- Ícono (escalado ~0.6, misma geometría que ezpayconnect_icono.svg) -->
  <g transform="translate(10,15) scale(0.6)">
    <rect x="20" y="90" width="200" height="60" rx="24" ry="24" fill="url(#ezpayGradientWordmark)"/>
    <rect x="90" y="20" width="60" height="200" rx="24" ry="24" fill="url(#ezpayGradientWordmark)"/>
    <polyline points="30,120 65,120 80,95 100,148 120,92 140,120 210,120"
              fill="none" stroke="#ffffff" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="196" y="14" width="18" height="18" rx="4" fill="#1857D6"/>
    <rect x="217" y="34" width="14" height="14" rx="3" fill="#2C6FE0"/>
    <rect x="179" y="40" width="12" height="12" rx="3" fill="#1DBFA8"/>
    <rect x="200" y="58" width="16" height="16" rx="4" fill="#12B7A0"/>
  </g>

  <!-- Wordmark: EZPay (azul marino) + Connect (teal) -->
  <text x="160" y="90" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700">
    <tspan fill="#16324F">EZPay</tspan><tspan fill="#12B7A0">Connect</tspan>
  </text>

  <!-- Pill "MED" debajo del wordmark -->
  <rect x="160" y="108" width="72" height="30" rx="15" fill="#12B7A0"/>
  <text x="196" y="129" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700"
        fill="#ffffff" text-anchor="middle">MED</text>
</svg>
